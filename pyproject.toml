[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []          # 不做打包：源码通过 pythonpath 挂载

[project]
name = "data-intelligence-platform"
version = "0.1.0"
description = "数据智能平台（对话优先 + Evidence-first）：纳管调度资产、串联血缘与业务口径，回答必带凭证"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "么慌" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",    # skill 契约声明的 YAML 解析（M1-02）；此前仅由 uvicorn[standard] 间接带入，属未声明依赖
  "mcp>=2.2,<3",    # MCP 服务端 SDK（M1-03）。锁 <3：2.x 已把 FastMCP 改名为 MCPServer，v3 变更需重新评估
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "psycopg[binary]>=3.1"]  # 审计/会话存储（W-117）
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

# 说明：各单元靠 pytest 的 pythonpath 挂载（单元可独立部署、源码树共享）；
# 但 `pip install -e ".[api,dev]"` 必须能跑（Makefile/CI 依赖它），所以下面声明 build-system，
# 并用 tool.setuptools.packages=[] 关掉自动发现——否则平铺多顶层目录会被 setuptools 拒绝（P0-1）。
[tool.pytest.ini_options]
pythonpath = [
  ".",
  "apps/portal-api/src",
  "apps/model-gateway/src",
  "packages/dip-contracts/src",
  "packages/dip-core/src",
  "packages/dip-agent/src",
  "packages/dip-skills/src",
  "packages/dip-lineage-skill/src",
  "integrations/lineage-client/src",
]
testpaths = ["tests", "integrations/lineage-client/tests", "packages"]
addopts = "-q --strict-markers"
markers = [
  "smoke: 需要真实内核服务（不在则跳过）",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 118
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
